# Mosquitto configuration for API Dash local MQTT testing.
#
# This config is intentionally frictionless for LOCAL testing:
#   - anonymous access is allowed (no username/password needed)
#   - persistence is on, so retained messages + persistent sessions
#     survive a broker restart
#
# NOTE: Mosquitto 2.x speaks MQTT v3.1, v3.1.1 AND v5 out of the box --
#       no extra configuration is required to enable MQTT v5.

# ---------------------------------------------------------------------------
# Listeners
# ---------------------------------------------------------------------------

# Plain MQTT over TCP. Point API Dash's MQTT client at mqtt://localhost:1883
listener 1883
protocol mqtt

# MQTT over WebSocket. Browser / web clients connect at ws://localhost:9001
listener 9001
protocol websockets

# ---------------------------------------------------------------------------
# Authentication
# ---------------------------------------------------------------------------

# Allow clients to connect without a username/password. This keeps local
# testing frictionless. Set this to `false` (and configure `password_file`
# below) to exercise API Dash's username/password auth.
allow_anonymous true

# --- To test username/password auth: ---------------------------------------
#   1. Create a password file (run inside the broker container, or in a
#      mounted directory the broker can read):
#        mosquitto_passwd -c -b /mosquitto/config/passwd testuser testpass
#   2. Uncomment the two lines below.
#   3. Set `allow_anonymous false` (comment out / change the line above).
#   4. Recreate the broker:
#        docker compose -f mqtt/docker-compose.yml up -d --force-recreate broker
#
# password_file /mosquitto/config/passwd
# allow_anonymous false

# ---------------------------------------------------------------------------
# Persistence (retained messages + persistent sessions survive a restart)
# ---------------------------------------------------------------------------
persistence true
persistence_location /mosquitto/data/

# ---------------------------------------------------------------------------
# Logging (to stdout so `docker compose logs broker` shows connect/pub/sub)
# ---------------------------------------------------------------------------
log_dest stdout
log_type all
connection_messages true
log_timestamp true
