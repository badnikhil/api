# Mosquitto configuration for API Dash local MQTT testing.
#
# This rig is intentionally frictionless for LOCAL testing AND exercises every
# transport/auth combination API Dash's MQTT client supports -- all provisioned
# automatically by the broker image's entrypoint (self-signed TLS cert +
# pre-seeded password file), so `docker compose up` is the only step.
#
# Listeners:
#   1883  plain MQTT over TCP            -- anonymous
#   9001  MQTT over WebSocket            -- anonymous
#   8883  MQTT over TLS (self-signed)    -- anonymous
#   1884  plain MQTT over TCP            -- username/password REQUIRED
#                                          (pre-seeded testuser / testpass)
#
# NOTE: Mosquitto 2.x speaks MQTT v3.1, v3.1.1 AND v5 out of the box on every
#       listener -- no extra configuration is required to enable MQTT v5.

# ---------------------------------------------------------------------------
# Per-listener settings
# ---------------------------------------------------------------------------
# With this on, auth/TLS settings (allow_anonymous, password_file, certfile,
# keyfile, require_certificate) apply to the listener they appear under, letting
# one broker mix anonymous, auth-required and TLS listeners at the same time.
per_listener_settings true

# ---------------------------------------------------------------------------
# Persistence (retained messages + persistent sessions survive a restart)
# ---------------------------------------------------------------------------
persistence true
persistence_location /mosquitto/data/

# ---------------------------------------------------------------------------
# Logging (to stdout so `docker compose logs broker` shows connect/pub/sub)
# ---------------------------------------------------------------------------
log_dest stdout
log_type all
connection_messages true
log_timestamp true

# ---------------------------------------------------------------------------
# Listener: 1883 -- plain MQTT over TCP, anonymous
# ---------------------------------------------------------------------------
# Point API Dash's MQTT client at mqtt://localhost:1883
listener 1883
protocol mqtt
allow_anonymous true

# ---------------------------------------------------------------------------
# Listener: 9001 -- MQTT over WebSocket, anonymous
# ---------------------------------------------------------------------------
# Browser / web clients connect at ws://localhost:9001
listener 9001
protocol websockets
allow_anonymous true

# ---------------------------------------------------------------------------
# Listener: 8883 -- MQTT over TLS (self-signed cert), anonymous
# ---------------------------------------------------------------------------
# Encrypted transport at mqtts://localhost:8883. The certificate is self-signed
# and generated on first start by the broker entrypoint, so in API Dash enable
# "Use TLS" AND "Allow Invalid Certificates" (the CN is localhost and there is
# no trusted CA). `require_certificate false` means clients are NOT asked for a
# client certificate -- this is server-auth (encryption) only. See docs/mqtt/tls.md
listener 8883
protocol mqtt
certfile /mosquitto/certs/server.crt
keyfile /mosquitto/certs/server.key
require_certificate false
allow_anonymous true

# ---------------------------------------------------------------------------
# Listener: 1884 -- plain MQTT over TCP, username/password REQUIRED
# ---------------------------------------------------------------------------
# Always-on auth listener for exercising API Dash's credential handling with
# ZERO config edits. The password file is pre-seeded by the broker entrypoint
# with testuser / testpass. Anonymous connects here are refused. See docs/mqtt/auth.md
listener 1884
protocol mqtt
allow_anonymous false
password_file /mosquitto/config/passwd

# ---------------------------------------------------------------------------
# Alternative: enable auth on the MAIN port (1883) instead of using 1884
# ---------------------------------------------------------------------------
# The dedicated 1884 listener above means you normally do NOT need to touch
# anything to test auth. If you'd rather require credentials on the primary
# 1883 listener instead, change its block above to:
#
#     listener 1883
#     protocol mqtt
#     allow_anonymous false
#     password_file /mosquitto/config/passwd
#
# The password file (testuser / testpass) is already created by the entrypoint;
# to add more users, exec into the broker and run:
#     mosquitto_passwd -b /mosquitto/config/passwd <user> <pass>
# then restart the broker.
